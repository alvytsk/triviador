name: CI

# Spec 1B §10.7's seven gates. Every job below runs the SAME command a
# developer runs locally — no gate here is reimplemented, only wired up.
# See task-12-report.md for the local verification of each one.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same tags backend/docker-compose.test.yml pins for local integration
  # tests. CI drifting from local is how a green build ships a broken
  # deploy — this plan has already produced two bugs that only appeared in
  # a container, so nothing here is re-picked independently.
  UV_VERSION: "0.5.11" # infra/backend.Dockerfile's ghcr.io/astral-sh/uv tag

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen

      - run: uv run ruff check .

      # KNOWN FAILING as of this commit (36 files): the repo had no CI
      # before this task, and `ruff format` has never been enforced.
      # Reformatting those files is out of scope for a CI-only task — see
      # task-12-report.md's concerns. Left enabled rather than dropped:
      # spec §10.7 names this gate explicitly, and a CI job quietly never
      # checking format is exactly the "gate that silently never runs"
      # failure mode this plan has already shipped once (a permanent
      # no-op guard, per an earlier task's report).
      - run: uv run ruff format --check .

      - run: uv run mypy --strict src

      # Same postgres:17-alpine / dxflrs/garage:v1.1.0 images and the same
      # compose file developers bring up locally, seeded by the same
      # script — not a second, drifting definition of "the test infra".
      - name: Start Postgres + Garage
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Seed Garage buckets
        run: ./testing/garage-init.sh

      # `pytest` alone: addopts already runs `--cov --cov-report=term-missing`,
      # and `[tool.coverage.report] fail_under = 100` (scoped to
      # domain/game/reducer.py and db/codec/*.py) is what enforces the
      # 100% branch-coverage gate — reimplementing that as a second step
      # here would be a second, driftable copy of the same gate.
      # `tests/codec/golden/` (the golden event corpus) and the full
      # integration suite (tests/db, tests/storage) all run in this one
      # invocation, against the services started above.
      - run: uv run pytest

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # pnpm/setup reads `packageManager` from frontend/package.json
      # (pinned to pnpm@11.22.0) and installs that exact version alongside
      # Node — no corepack ambiguity from a repo root with no package.json
      # of its own.
      - uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          runtime: node@22
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false

      - run: pnpm install --frozen-lockfile

      # biome + tsc --noEmit + steiger.
      - run: pnpm check

      - run: pnpm test

      # vite build + scripts/assert-admin-split.mjs. GitHub Actions sets
      # CI=true for every step itself, which is what makes pnpm's install
      # (above) and this build behave in their non-interactive mode.
      - run: pnpm check:bundle

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen
        working-directory: backend

      - uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          runtime: node@22
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      # Needs no database: `export_contracts` builds the app from
      # `AppDependencies.placeholder()`.
      - run: uv run triviador export-contracts --out ../contracts
        working-directory: backend

      - run: pnpm codegen
        working-directory: frontend

      # The drift catcher: export-contracts + codegen must reproduce
      # exactly what is already committed, or a contract changed without
      # its generated client being regenerated.
      - run: git diff --exit-code

  maps:
    name: maps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen

      # tests/maps validates the shipped data/maps/czechia directly (both
      # map.json topology via MapRegistry and the map.svg whitelist via
      # validate_map_directory); tests/domain/maps covers the same
      # validate_map() topology rules against synthetic graphs. Neither
      # needs a database, so this stays its own fast job rather than
      # waiting on the backend job's Postgres/Garage services.
      - run: uv run pytest tests/maps tests/domain/maps -q --no-cov

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen

      - name: Start Postgres
        run: docker compose -f docker-compose.test.yml up -d --wait postgres-test

      # `test_upgrade_head_from_empty_database` drops the schema and runs
      # `alembic upgrade head` from nothing; `test_alembic_check_is_clean`
      # runs the same `compare_metadata` machinery the `alembic check` CLI
      # command runs. These two tests already are that gate — a bare
      # `alembic check` subprocess here would be a second, driftable copy
      # of what this file already asserts.
      - run: uv run pytest tests/db/test_migrations.py -q --no-cov -m integration

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cp .env.example .env

      # NOTE: an all-CHANGE_ME .env satisfies every `${VAR:?}` in these
      # compose files — `:?` only rejects an *unset* variable, not a
      # placeholder value. So this job proves both overlays parse and wire
      # together (service graph, volumes, env substitution), NOT that the
      # resulting configuration is usable. Do not read a green `compose`
      # job as "the prod stack would actually boot."
      - name: dev overlay
        run: docker compose -f compose.yaml -f compose.dev.yaml config >/dev/null

      - name: prod overlay
        run: docker compose -f compose.yaml -f compose.prod.yaml config >/dev/null

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    steps:
      - uses: actions/checkout@v7

      # `infra/deploy.sh` needs a real, non-placeholder `.env` — the
      # `compose` job's all-CHANGE_ME trick satisfies every `${VAR:?}`
      # but fails `startup_problems()`'s own placeholder check at boot, so
      # this deploy would never become ready. Generated fresh every run:
      # nothing here needs to be reproducible, only internally consistent
      # — the same Postgres password in both `POSTGRES_PASSWORD` and
      # `TRIVIADOR_DATABASE_URL`, and Garage's own key-format rules
      # (`.env.example`'s comment: `GK` + 24 hex, secret = 64 hex).
      # `TRIVIADOR_ALLOWED_ORIGINS` must be this job's own origin —
      # e2e/playwright.config.ts's default `baseURL` — because every POST
      # the scenario makes (redeem, create, join, start, every admin
      # write the seed does) is checked against it, and the websocket
      # handshake's `Origin` header is checked the same way.
      - name: Write .env
        run: |
          set -eu
          pg_password="$(openssl rand -hex 24)"
          cat > .env <<EOF
          TRIVIADOR_DATABASE_URL=postgresql+asyncpg://triviador:${pg_password}@db:5432/triviador
          TRIVIADOR_ALLOWED_ORIGINS=http://localhost
          TRIVIADOR_ALLOWED_HOSTS=localhost,127.0.0.1
          TRIVIADOR_COOKIE_SECURE=false
          TRIVIADOR_SESSION_TTL_DAYS=30
          TRIVIADOR_MAPS_ROOT=/data/maps
          TRIVIADOR_MEDIA_PUBLIC_BASE=/media
          TRIVIADOR_LOG_LEVEL=INFO
          TRIVIADOR_LOG_FORMAT=json
          TRIVIADOR_S3_ENDPOINT_URL=http://garage:3900
          TRIVIADOR_S3_REGION=garage
          TRIVIADOR_S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)
          TRIVIADOR_S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)
          TRIVIADOR_MEDIA_BUCKET=triviador-media
          TRIVIADOR_STAGING_BUCKET=triviador-staging
          TRIVIADOR_IMPORT_TTL_HOURS=24
          POSTGRES_PASSWORD=${pg_password}
          GARAGE_RPC_SECRET=$(openssl rand -hex 32)
          BACKUP_DEST=/tmp/triviador-e2e-backups
          EOF

      # The one supported deploy path (§10.11) — not a hand-assembled
      # `docker compose up`, which can silently skip the `migrate` and
      # `garage-init` one-shots. Task 10 already proved this script boots
      # a serving stack; this job is what proves a browser can actually
      # play a match through it.
      - name: Deploy the production compose stack
        run: ./infra/deploy.sh

      - uses: pnpm/setup@v2
        with:
          package-json-file: e2e/package.json
          runtime: node@22
          cache: true
          cache-dependency-path: e2e/pnpm-lock.yaml
          install: false

      - run: pnpm install --frozen-lockfile
        working-directory: e2e

      # `--with-deps`: this runner has no browser cached (unlike a
      # developer machine that already has Playwright installed for other
      # projects), so this also installs the system libraries Chromium
      # needs.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e

      # Spec 1 §12.4's one scenario: three independent browser contexts
      # redeem an invite each, create → join → start a shortened match
      # (expansion 1 / battle 1), and play it to `FINISHED`, asserting a
      # real 200 through Caddy → Garage for a media question along the
      # way — the seam no API-level test in `backend` or `frontend`
      # reaches.
      - run: pnpm exec playwright test
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.prod.yaml down -v

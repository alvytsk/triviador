# Test-only PostgreSQL. Deliberately on 5433 so it can never collide with a
# real local server on 5432, and `tmpfs` because nothing here should survive
# a run — a test database with leftover state is a test that lies.
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: triviador
      POSTGRES_PASSWORD: triviador
      POSTGRES_DB: triviador_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triviador -d triviador_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Test-only Garage, §9.1's two buckets. Same reasoning as postgres-test:
  # a fixed loopback port that cannot collide with anything real, and no
  # persistence. The S3 API is on 3900; `testing/garage-init.sh` runs once
  # against it from the host.
  garage-test:
    image: dxflrs/garage:v1.1.0
    environment:
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    volumes:
      - ./testing/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    tmpfs:
      - /var/lib/garage/meta
      - /var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30
